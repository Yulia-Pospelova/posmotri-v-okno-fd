<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Посмотри в окно</title>
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./styles/variables.css" />
    <link rel="stylesheet" href="./styles/globals.css" />
    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="stylesheet" href="./styles/preloader.css" />
    <link rel="stylesheet" href="./styles/error.css" />
    <script defer src="./scripts/script.js"></script>
  </head>
  <body class="page">
    <main class="content">
      <section class="search">
        <div class="search__media">
          <video class="search__video" src="" controls poster=""></video>
        </div>
        <form class="search-form">
          <fieldset class="search-form__fieldset">
            <legend class="search-form__legend">Город</legend>
            <label class="search-form__label">
              <span class="visually-hidden">Город</span>
              <input
                class="search-form__textfield"
                type="text"
                name="city"
                placeholder="Санкт Петербург, например"
              />
            </label>
          </fieldset>
          <fieldset class="search-form__fieldset">
            <legend class="search-form__legend">Время суток</legend>
            <ul class="search-form__checkbox-list">
              <li class="search-form__checkbox-item">
                <label class="search-form__label">
                  <input
                    class="search-form__checkbox visually-hidden"
                    type="checkbox"
                    name="time"
                    value="morning"
                  />
                  <span class="search-form__pseudo-checkbox"></span>
                  <span class="search-form__label-text">Утро</span>
                </label>
              </li>
              <li class="search-form__checkbox-item">
                <label class="search-form__label">
                  <input
                    class="search-form__checkbox visually-hidden"
                    type="checkbox"
                    name="time"
                    value="afternoon"
                  />
                  <span class="search-form__pseudo-checkbox"></span>
                  <span class="search-form__label-text">День</span>
                </label>
              </li>
              <li class="search-form__checkbox-item">
                <label class="search-form__label">
                  <input
                    class="search-form__checkbox visually-hidden"
                    type="checkbox"
                    name="time"
                    value="night"
                  />
                  <span class="search-form__pseudo-checkbox"></span>
                  <span class="search-form__label-text">Ночь</span>
                </label>
              </li>
            </ul>
          </fieldset>
          <button class="button search-form__submit-button" type="submit">
            Найти
          </button>
        </form>
      </section>
      <section class="videos">
        <h1 class="videos__title">
          <span class="videos__accent">По-</span><br />смотри<br />в окно
        </h1>
        <div class="videos__list-container">
          <ul class="videos__list" aria-label="Список видео"></ul>
        </div>
      </section>
    </main>
    <template class="preloader-template">
      <div class="preloader">
        <div class="preloader-chasing-squares">
          <div class="square"></div>
          <div class="square"></div>
          <div class="square"></div>
          <div class="square"></div>
        </div>
      </div>
    </template>
    <template class="cards-list-item-template">
      <li class="videos__item">
        <a href="#0" class="video-card">
          <article class="video-card__content">
            <div class="video-card__description">
              <h2 class="video-card__title"></h2>
              <p class="video-card__text"></p>
            </div>
            <img class="video-card__thumbnail" src="" alt="" />
          </article>
        </a>
      </li>
    </template>
    <template class="more-button-template">
      <button class="button more-button">Показать еще</button>
    </template>
    <template class="error-template">
      <div class="error">
        <h2 class="error__title">
          Из этого города нет видео <span aria-hidden="true">:(</span>
        </h2>
      </div>
    </template>
  </body>
</html>
